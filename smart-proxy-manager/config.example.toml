# Smart Proxy Manager 示例配置
# 用法：复制为 config.toml 后按需修改。config.toml 已被 .gitignore 排除，
# 不要把含真实订阅地址 / Token 的配置提交到仓库，也不要写进日志。

[storage]
# SQLite 数据库文件（相对项目根目录或绝对路径）
db_path = "data/spm.db"

# 订阅数据源（可配置多个）。下面均为占位示例，不含任何真实凭据。
# kind: "url" = 远程订阅链接；"file" = 本地订阅文件
# is_public: 公开节点源（如 V2RayAggregator 已生成的公开订阅）标 true，
#            与私人订阅隔离存放、隔离筛选，第一版默认不混用。
[[sources]]
name = "example-remote"
kind = "url"
location = "https://example.com/your-subscription-url"
is_public = false
enabled = true

[[sources]]
name = "example-public"
kind = "url"
location = "https://example.com/public-aggregated-subscription"
is_public = true
enabled = false

[output]
# 生成的 Mihomo 配置输出目录与文件名
# 注意：生成文件只包含 proxies / proxy-providers，不写 external-controller、
# secret、端口等控制面键（这些由 Clash Verge Rev 接管，见可行性报告 Q2）。
dir = "output"
profile_file = "smart-proxy.yaml"

[tester]
# 节点检测默认参数（阶段 2 使用；优先复用 Mihomo 健康检查 / REST API）
test_url = "https://www.gstatic.com/generate_204"
timeout_seconds = 5
concurrency = 10

[scorer]
# 评分权重（阶段 2 使用，总和应为 1.0）
weight_success_rate = 0.45
weight_latency = 0.30
weight_stability = 0.25

[update]
# 订阅自动刷新间隔（分钟，0 = 不自动刷新；阶段 3 使用）
interval_minutes = 0
